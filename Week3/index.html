
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Set character encoding -->
    <meta charset="UTF-8">

    <!-- Make the page responsive on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Set the browser tab title -->
    <title>My Web Page</title>
</head>

<body>
    <!-- Main heading of the webpage -->
    <h1>Welcome to My Website</h1>

    <!-- Introduction section -->
    <h2>Introduction</h2>
    <p>
        Hello! Welcome to my <strong>first website</strong>.
        I am learning <em>HTML</em> to create web pages.
    </p>

    <!-- Display an image with descriptive alternative text -->
    <img
        src="images/profile.jpg"
        alt="A profile photo of the website author"
        width="300"
    >

    <!-- Add a horizontal divider -->
    <hr>

    <!-- Skills section -->
    <div id="skills" class="section">
        <h2>Skills</h2>
        <p>I am learning HTML and CSS.</p>
    </div>

    <!-- Education section -->
    <div id="education" class="section">
        <h2>Education</h2>
        <p>I enjoy learning new things!</p>
    </div>

</body>

</html>
