<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechDashboard - CSS Grid Lab</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">Header Area</header>
        <aside class="dashboard-sidebar">Sidebar Area</aside>
        <main class="dashboard-main">
            <h2>Overview Statistics</h2>
            <div class="stats-grid">
                <div class="stat-card">Users: 1,240</div>
                <div class="stat-card">Revenue: $12,400</div>
                <div class="stat-card">Active Now: 312</div>
                <div class="stat-card">Conversion: 4.8%</div>
            </div>
        </main>
        <footer class="dashboard-footer">Footer Area</footer>
    </div>
</body>
</html>
